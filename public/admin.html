<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ward 27 Admin</title>
<meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: navy header, filter bar, stacked response cards on phone, table on desktop */
:root{--navy:#1b2a5e;--yellow:#f4b63c;--blue:#0077b6;--bg:#f5f1e6;--surface:#fff;--fg:#1b2a5e;--muted:#5a6690;--line:#e3dcc4;
--g:#1e8e4a;--r:#c62828;--chip:#fdecc0;--f-d:'Mukta','Noto Sans Devanagari',system-ui,sans-serif;--f-b:'Noto Sans Devanagari','Mukta',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0b1130;--bg:#0f1530;--surface:#19214a;--fg:#f4f0e2;--muted:#b3bbd9;--line:#2b3566;--chip:#2a3466;--blue:#4db3ea;--r:#ff7a70;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#0b1130;--bg:#0f1530;--surface:#19214a;--fg:#f4f0e2;--muted:#b3bbd9;--line:#2b3566;--chip:#2a3466;--blue:#4db3ea;--r:#ff7a70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--f-b)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--navy);color:#fff;margin-top:calc(-1*env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:14px}
h1{font:800 22px/1.2 var(--f-d);margin:0}
h1 small{display:block;color:var(--yellow);font:600 14px var(--f-d)}
.out{border:2px solid var(--yellow);background:none;color:#fff;border-radius:999px;padding:6px 16px;font:600 14px var(--f-d);min-height:40px}
.demo{background:var(--yellow);color:#1b2a5e;font:700 14px var(--f-d);padding:8px 0;text-align:center}
main{padding-block:20px 40px;display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.st b{display:block;font:800 30px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.st span{color:var(--muted);font-size:14px}
.bar{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.bar{grid-template-columns:2fr 1fr 1fr auto}}
input,select{width:100%;min-height:46px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:400 16px var(--f-b);padding:8px 12px}
.btn{min-height:46px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:700 15px var(--f-d);padding:0 18px;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.list{display:grid;gap:10px}
.it{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.it.new{border-left:6px solid var(--yellow)}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top b{font:700 17px var(--f-d)}
.tag{font:700 12px var(--f-d);padding:2px 10px;border-radius:999px;background:var(--chip)}
.tag.c{background:#fde2e0;color:#7f1d1d}.tag.s{background:#dff3e4;color:#14532d}.tag.v{background:#dbeafe;color:#1e3a8a}
.when{margin-left:auto;color:var(--muted);font-size:13px}
.msg{margin:8px 0 0;overflow-wrap:anywhere}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.a{border:1px solid var(--line);background:none;color:var(--fg);border-radius:8px;padding:6px 12px;font:600 13px var(--f-d);min-height:36px;cursor:pointer}
.a.wa{background:var(--g);border-color:var(--g);color:#fff}
.empty{text-align:center;color:var(--muted);padding:30px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;font:600 14px var(--f-d)}
</style>

<header><div class="wrap"><h1>Ward 27 Inbox<small>Admin · private</small></h1><button class="out" id="out" type="button" hidden>Log out</button></div></header>
<section class="wrap" id="login" style="padding-block:40px;max-width:420px">
  <form id="lf" class="it" style="display:grid;gap:12px">
    <h2 style="margin:0;font:800 22px var(--f-d)">Enter password</h2>
    <input id="pw" type="password" autocomplete="current-password" aria-label="Password" required>
    <button class="btn" type="submit">Open</button>
    <div id="lerr" class="when" style="margin:0" role="alert"></div>
  </form>
</section>
<main class="wrap" id="app" hidden>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search name or message" aria-label="Search">
    <select id="fs" aria-label="Sector"><option value="">All sectors</option><option>38-W</option><option>39</option><option>40</option></select>
    <select id="ft" aria-label="Type"><option value="">All types</option><option value="suggestion">Suggestion</option><option value="complaint">Complaint</option><option value="support">Support</option><option value="volunteer">Volunteer</option></select>
    <button class="btn" id="csv" type="button">Copy CSV</button>
  </div>
  <div class="list" id="list"></div>
  <section class="it" id="vimp" style="display:grid;gap:10px">
    <h2 style="margin:0;font:800 20px var(--f-d)">Voter list import (powers "Find your vote")</h2>
    <p class="msg" style="margin:0">Voters in the list: <b id="vcount">…</b></p>
    <p class="meta" style="margin:0">The first row of the CSV must have these column names: <code>epic,name,relative,age,gender,house,sector,part,serial,booth,booth_address</code>. Only <code>name</code> is required.</p>
    <input id="vfile" type="file" accept=".csv,text/csv" aria-label="CSV file">
    <label style="display:flex;gap:8px;align-items:center"><input id="vrep" type="checkbox" style="width:auto;min-height:0" checked> Replace the existing list</label>
    <div class="acts"><button class="btn" id="vgo" type="button">Import</button><button class="a" id="vclr" type="button">Delete the whole list</button></div>
    <div id="vmsg" class="when" style="margin:0" role="status"></div>
  </section>
</main>
<div id="toast" hidden></div>

<script>
(function(){
  var T={suggestion:["Suggestion","s"],complaint:["Complaint","c"],support:["Support","v"],volunteer:["Volunteer","s"]};
  var D=[];
  var $=function(i){return document.getElementById(i)};
  function api(path,opt){opt=opt||{};opt.headers=Object.assign({"content-type":"application/json"},opt.headers||{});opt.credentials="same-origin";return fetch(path,opt).then(function(r){return r.json().then(function(j){j._s=r.status;return j})})}
  function ago(ms){var m=Math.floor((Date.now()-ms)/60000);if(m<1)return"just now";if(m<60)return m+" min ago";var h=Math.floor(m/60);if(h<24)return h+" hr ago";var d=Math.floor(h/24);return d+(d===1?" day ago":" days ago")}
  function toast(t){var e=$("toast");e.textContent=t;e.hidden=false;setTimeout(function(){e.hidden=true},1800)}
  function stats(){
    var c=function(t){return D.filter(function(r){return r.type===t}).length};
    $("stats").innerHTML=[["Total",D.length],["New",D.filter(function(r){return !r.is_read}).length],["Suggestions",c("suggestion")],["Complaints",c("complaint")],["Volunteers",c("volunteer")]].map(function(x){return '<div class="st"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("");
  }
  function waNum(p){var d=String(p||"").replace(/\D/g,"");if(d.length===10)return"91"+d;if(d.length>=11)return d;return""}
  function render(){
    var q=$("q").value.trim().toLowerCase(),fs=$("fs").value,ft=$("ft").value;
    var rows=D.filter(function(r){return(!fs||r.sector===fs)&&(!ft||r.type===ft)&&(!q||((r.name||"")+" "+r.message).toLowerCase().indexOf(q)>-1)});
    stats();var L=$("list");L.textContent="";
    if(!rows.length){var em=document.createElement("div");em.className="empty";em.textContent=D.length?"No feedback matches your search":"No feedback received yet";L.appendChild(em);return}
    rows.forEach(function(r){
      var e=document.createElement("article");e.className="it"+(r.is_read?"":" new");
      var tg=T[r.type]||T.suggestion;
      e.innerHTML='<div class="top"><b></b><span class="tag"></span><span class="tag '+tg[1]+'">'+tg[0]+'</span><span class="when">'+ago(r.created_at)+'</span></div><p class="msg"></p><div class="meta"><span class="ph"></span></div><div class="acts"></div>';
      e.querySelector("b").textContent=r.name||"No name given";
      e.querySelector(".tag").textContent=r.sector?"Sector "+r.sector:"Sector —";
      e.querySelector(".msg").textContent=r.message;
      e.querySelector(".ph").textContent="Phone: "+(r.phone||"not given");
      var A=e.querySelector(".acts");
      function btn(t,cls,fn){var b=document.createElement("button");b.type="button";b.className="a"+(cls?" "+cls:"");b.textContent=t;b.onclick=fn;A.appendChild(b)}
      btn(r.is_read?"Mark as new":"Mark as read","",function(){var v=r.is_read?0:1;api("/api/admin/read",{method:"POST",body:JSON.stringify({id:r.id,read:v})}).then(function(j){if(j.ok){r.is_read=v;render()}})});
      var n=waNum(r.phone);
      if(n){var a=document.createElement("a");a.className="a wa";a.textContent="Reply on WhatsApp";a.href="https://wa.me/"+n;a.target="_blank";a.rel="noopener";a.style.textDecoration="none";a.style.display="inline-flex";a.style.alignItems="center";A.appendChild(a)}
      var armed=false;
      btn("Delete","",function(ev){var b=ev.target;if(!armed){armed=true;b.textContent="Confirm delete?";setTimeout(function(){armed=false;b.textContent="Delete"},3000);return}api("/api/admin/delete",{method:"POST",body:JSON.stringify({id:r.id})}).then(function(j){if(j.ok){D=D.filter(function(x){return x.id!==r.id});render();toast("Deleted")}})});
      L.appendChild(e);
    });
  }
  function load(){
    return api("/api/admin/list").then(function(j){
      if(j._s===401){throw new Error("401")}
      D=j.rows||[];$("login").hidden=true;$("app").hidden=false;$("out").hidden=false;render();vcount();
    });
  }

  /* ---- voter list import ---- */
  function parseCSV(t){
    var rows=[],r=[],f="",q=false,i=0;
    t=t.replace(/^\uFEFF/,"");
    for(;i<t.length;i++){var c=t[i];
      if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
      else if(c==='"') q=true;
      else if(c===","){ r.push(f);f="" }
      else if(c==="\n"||c==="\r"){ if(c==="\r"&&t[i+1]==="\n")i++; r.push(f);f=""; if(r.length>1||r[0]!=="")rows.push(r); r=[] }
      else f+=c }
    if(f!==""||r.length){r.push(f);rows.push(r)}
    return rows;
  }
  function vcount(){api("/api/admin/voters/count").then(function(j){if(j.ok)$("vcount").textContent=j.count})}
  $("vgo").onclick=function(){
    var file=$("vfile").files[0],m=$("vmsg");
    if(!file){m.textContent="Choose a CSV file first";return}
    var fr=new FileReader();
    fr.onload=function(){
      var all=parseCSV(String(fr.result)),head=all.shift()||[];
      head=head.map(function(x){return x.trim().toLowerCase()});
      if(head.indexOf("name")<0){m.textContent="Column 'name' not found";return}
      var data=all.map(function(r){var o={};head.forEach(function(k,i){o[k]=r[i]});return o}).filter(function(o){return o.name});
      if(!data.length){m.textContent="No rows found in the file";return}
      $("vgo").disabled=true;var done=0,first=$("vrep").checked;
      (function next(){
        if(done>=data.length){m.textContent=data.length+" voters added";$("vgo").disabled=false;vcount();return}
        var chunk=data.slice(done,done+50);
        api("/api/admin/voters/import",{method:"POST",body:JSON.stringify({rows:chunk,replace:first})}).then(function(j){
          if(!j.ok){throw new Error("x")}
          first=false;done+=chunk.length;m.textContent=done+" / "+data.length+" added…";next();
        }).catch(function(){m.textContent="Import stopped part-way ("+done+" added). Please try again.";$("vgo").disabled=false;vcount()});
      })();
    };
    fr.readAsText(file,"utf-8");
  };
  var armedClr=false;
  $("vclr").onclick=function(){var b=$("vclr");if(!armedClr){armedClr=true;b.textContent="Confirm delete?";setTimeout(function(){armedClr=false;b.textContent="Delete the whole list"},3000);return}
    api("/api/admin/voters/clear",{method:"POST",body:"{}"}).then(function(j){if(j.ok){$("vmsg").textContent="List deleted";vcount()}})};
  function showLogin(){D=[];$("list").textContent="";$("stats").textContent="";$("q").value="";$("app").hidden=true;$("out").hidden=true;$("login").hidden=false;$("pw").value=""}
  $("lf").addEventListener("submit",function(ev){ev.preventDefault();$("lerr").textContent="";
    api("/api/admin/login",{method:"POST",body:JSON.stringify({password:$("pw").value})}).then(function(j){
      $("pw").value="";
      if(!j.ok){$("lerr").textContent="Wrong password";return}
      return load();
    }).catch(function(){$("lerr").textContent="Connection problem, please try again"})});
  $("out").onclick=function(){api("/api/admin/logout",{method:"POST",body:"{}"}).then(showLogin,showLogin)};
  ["q","fs","ft"].forEach(function(i){$(i).addEventListener("input",render)});
  $("csv").onclick=function(){
    var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};
    var s="Time,Name,Phone,Sector,Type,Message\n"+D.map(function(r){return[new Date(r.created_at).toLocaleString(),r.name,r.phone,r.sector,(T[r.type]||T.suggestion)[0],r.message].map(q).join(",")}).join("\n");
    try{navigator.clipboard.writeText(s).then(function(){toast("CSV copied")},function(){toast("Could not copy")})}catch(e){toast("Could not copy")}
  };
  setInterval(function(){if(!$("app").hidden)api("/api/admin/list").then(function(j){if(j.ok){D=j.rows;render()}else if(j._s===401){showLogin()}})},60000);
  load().catch(function(){});
})();
</script>

</html>
